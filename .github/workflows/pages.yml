# Pages currently publishes this branch root (legacy). `.nojekyll` plus the
# committed `index.html`, `404.html`, `favicon.svg`, and `assets/` are what
# https://barneysmith-sys.github.io/fly/ serves. Refresh those files with
# `GITHUB_PAGES=true npm run build` and `node scripts/sync-pages.mjs`.
# This workflow builds the same app. It becomes the live source only after
# the repository Pages setting is switched to GitHub Actions.
name: Deploy FLY to GitHub Pages

on:
  push:
    branches:
      - cursor/aerosim-vertical-hover-9935
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
